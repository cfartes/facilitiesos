name: nexus-facilities-production
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-api: &api
  image: nexus-facilities-api:${RELEASE:?Execute o instalador}
  build: {context: ., dockerfile: backend/Dockerfile}
  logging: *logging
  labels: {traefik.enable: "false"}
services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    logging: *logging
    labels: {traefik.enable: "false"}
    environment:
      POSTGRES_DB: facilities
      POSTGRES_USER: facilities_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute o instalador}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Execute o instalador}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Execute o instalador}
    volumes:
      - facilities_data:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U facilities_owner -d facilities"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *api
    profiles: [maintenance]
    command: [python, -m, backend.migrate]
    environment:
      FACILITIES_MIGRATION_DATABASE_URL: postgresql+psycopg://facilities_owner:${POSTGRES_PASSWORD}@db:5432/facilities
    networks: [database]
  api:
    <<: *api
    restart: unless-stopped
    stop_grace_period: 35s
    command: [python, -m, uvicorn, backend.main:create_app, --factory, --host, 0.0.0.0, --port, "8000", --no-access-log, --proxy-headers, --forwarded-allow-ips, "${TRAEFIK_TRUSTED_IPS:?Execute o instalador}"]
    environment:
      FACILITIES_ENV: production
      FACILITIES_RELEASE: ${RELEASE:?Execute o instalador}
      FACILITIES_ORIGIN: https://facilities.nexusdataanalytics.tech
      FACILITIES_WEBHOOK_ORIGIN: https://facilities.nexusdataanalytics.tech
      FACILITIES_ADMIN_EMAIL: ${FACILITIES_ADMIN_EMAIL:?Execute o instalador}
      FACILITIES_ADMIN_PASSWORD_HASH: ${FACILITIES_ADMIN_PASSWORD_HASH:?Execute o instalador}
      FACILITIES_ENCRYPTION_KEY: ${FACILITIES_ENCRYPTION_KEY:?Execute o instalador}
      FACILITIES_DATABASE_URL: postgresql+psycopg://facilities_app:${APP_DB_PASSWORD}@db:5432/facilities
      FACILITIES_PLATFORM_DATABASE_URL: postgresql+psycopg://facilities_platform:${PLATFORM_DB_PASSWORD}@db:5432/facilities
    networks: [database, outbound, traefik]
    depends_on: {db: {condition: service_healthy}}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?Execute o instalador}
      traefik.http.routers.facilities-api.rule: Host(`facilities.nexusdataanalytics.tech`) && PathPrefix(`/api/`)
      traefik.http.routers.facilities-api.priority: "100"
      traefik.http.routers.facilities-api.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:?Execute o instalador}
      traefik.http.routers.facilities-api.tls: "true"
      traefik.http.routers.facilities-api.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?Execute o instalador}
      traefik.http.routers.facilities-api.service: facilities-api
      traefik.http.services.facilities-api.loadbalancer.server.port: "8000"
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request,urllib.parse; h=urllib.parse.urlsplit(os.environ['FACILITIES_ORIGIN']).netloc; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health',headers={'Host':h}),timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    image: nexus-facilities-web:${RELEASE:?Execute o instalador}
    build: {context: ., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    logging: *logging
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?Execute o instalador}
      traefik.http.routers.facilities-web.rule: Host(`facilities.nexusdataanalytics.tech`)
      traefik.http.routers.facilities-web.priority: "10"
      traefik.http.routers.facilities-web.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:?Execute o instalador}
      traefik.http.routers.facilities-web.tls: "true"
      traefik.http.routers.facilities-web.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?Execute o instalador}
      traefik.http.routers.facilities-web.service: facilities-web
      traefik.http.services.facilities-web.loadbalancer.server.port: "80"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  database: {internal: true}
  outbound: {}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?Execute o instalador}
volumes:
  facilities_data:
